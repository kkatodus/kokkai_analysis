name: Deploy Frontend

on:
  push:
    branches:
      - dev
      - stg
      - prd
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy (dev, staging, prod)"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  AWS_REGION: ap-northeast-1
  NODE_VERSION: "22"

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Determine build output directory
        id: build-output
        working-directory: frontend
        run: |
          if [ -d "out" ]; then
            echo "directory=out" >> $GITHUB_OUTPUT
            echo "Found static export in 'out' directory"
          elif [ -d ".next" ]; then
            echo "directory=.next" >> $GITHUB_OUTPUT
            echo "Found Next.js build in '.next' directory"
          else
            echo "Error: No build output found. Expected 'out' (static export) or '.next' (default build)"
            exit 1
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/${{ steps.build-output.outputs.directory }}
          retention-days: 1

  deploy:
    name: Deploy to S3 and CloudFront
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine environment from branch
        id: env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            # Manual trigger: use input
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          else
            # Automatic trigger: determine from branch name
            BRANCH_NAME="${{ github.ref_name }}"
            case $BRANCH_NAME in
              dev)
                echo "environment=dev" >> $GITHUB_OUTPUT
                ;;
              stg)
                echo "environment=staging" >> $GITHUB_OUTPUT
                ;;
              prd)
                echo "environment=prod" >> $GITHUB_OUTPUT
                ;;
              *)
                echo "Error: Unknown branch '$BRANCH_NAME'. Expected: dev, stg, or prd"
                echo "Note: main and master branches do not trigger deployments."
                exit 1
                ;;
            esac
          fi
          echo "Deploying to environment: ${{ steps.env.outputs.environment }}"
          echo "Branch: ${{ github.ref_name }}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend-build

      - name: Get stack outputs
        id: stack-outputs
        run: |
          ENV="${{ steps.env.outputs.environment }}"
          STACK_NAME="FrontendStack-${ENV}"
          
          echo "Fetching outputs from stack: $STACK_NAME"
          
          # Get bucket name
          BUCKET_NAME=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue" \
            --output text \
            --region ${{ env.AWS_REGION }} 2>/dev/null || echo "")
          
          if [ -z "$BUCKET_NAME" ]; then
            echo "Error: Could not find bucket name from stack outputs."
            echo "Make sure the infrastructure stack '$STACK_NAME' is deployed first."
            exit 1
          fi
          
          # Get distribution ID
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendDistributionId'].OutputValue" \
            --output text \
            --region ${{ env.AWS_REGION }} 2>/dev/null || echo "")
          
          if [ -z "$DISTRIBUTION_ID" ]; then
            echo "Error: Could not find CloudFront distribution ID from stack outputs."
            exit 1
          fi
          
          echo "bucket_name=$BUCKET_NAME" >> $GITHUB_OUTPUT
          echo "distribution_id=$DISTRIBUTION_ID" >> $GITHUB_OUTPUT
          echo "Found bucket: $BUCKET_NAME"
          echo "Found distribution: $DISTRIBUTION_ID"

      - name: Determine build output directory
        id: build-output
        run: |
          if [ -d "frontend-build/out" ]; then
            echo "directory=frontend-build/out" >> $GITHUB_OUTPUT
            echo "Using static export from 'out' directory"
          elif [ -d "frontend-build/.next" ]; then
            echo "directory=frontend-build/.next" >> $GITHUB_OUTPUT
            echo "Using Next.js build from '.next' directory"
          else
            echo "Error: No build output found in artifacts"
            exit 1
          fi

      - name: Sync to S3
        run: |
          aws s3 sync ${{ steps.build-output.outputs.directory }} \
            s3://${{ steps.stack-outputs.outputs.bucket_name }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "*.html" \
            --exclude "*.json"
          
          # Upload HTML and JSON files with shorter cache
          aws s3 sync ${{ steps.build-output.outputs.directory }} \
            s3://${{ steps.stack-outputs.outputs.bucket_name }} \
            --delete \
            --cache-control "public, max-age=0, must-revalidate" \
            --include "*.html" \
            --include "*.json"
          
          echo "Successfully synced files to S3 bucket: ${{ steps.stack-outputs.outputs.bucket_name }}"

      - name: Invalidate CloudFront cache
        run: |
          DISTRIBUTION_ID="${{ steps.stack-outputs.outputs.distribution_id }}"
          
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" \
            --query "Invalidation.Id" \
            --output text \
            --region ${{ env.AWS_REGION }})
          
          echo "Created CloudFront invalidation: $INVALIDATION_ID"
          echo "Waiting for invalidation to complete..."
          
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" \
            --id "$INVALIDATION_ID" \
            --region ${{ env.AWS_REGION }} || echo "Note: Invalidation may still be in progress"
          
          echo "Cache invalidation completed"

      - name: Deployment summary
        run: |
          echo "## Frontend Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ steps.env.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket**: ${{ steps.stack-outputs.outputs.bucket_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront Distribution**: ${{ steps.stack-outputs.outputs.distribution_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Output**: ${{ steps.build-output.outputs.directory }}" >> $GITHUB_STEP_SUMMARY
